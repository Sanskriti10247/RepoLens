name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: repolens
          POSTGRES_PASSWORD: repolens
          POSTGRES_DB: repolens_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U repolens" --health-interval 2s
          --health-timeout 3s --health-retries 30
    env:
      REPOLENS_TEST_DATABASE_URL: postgresql+psycopg://repolens:repolens@127.0.0.1:5433/repolens_test
      REPOLENS_REQUIRE_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - name: Format
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy
      - name: Import boundaries
        run: uv run lint-imports
      - name: Tests
        run: uv run coverage run -m pytest && uv run coverage report --skip-empty

  sandbox:
    runs-on: ubuntu-latest
    env:
      REPOLENS_REQUIRE_DOCKER: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.14"
      - run: uv sync --locked
      - name: Build sandbox image
        run: ./scripts/build-sandbox.sh
      - name: Sandbox and git security tests
        run: uv run pytest -q tests/security

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: uv sync --locked
      - run: npm ci --no-audit --no-fund
      - run: npx --workspace apps/web playwright install --with-deps chromium
      - run: ./scripts/build-sandbox.sh
      - run: npm --workspace apps/web run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Browser end-to-end workflow
        run: ./scripts/e2e.sh

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm --workspace apps/web run lint
      - run: npm --workspace apps/web run typecheck
      - run: npm --workspace apps/web run test
      - run: npm --workspace apps/web run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@v10
      - name: Audit Python dependencies
        run: uv export --locked --no-dev --no-emit-project --format requirements-txt > requirements.txt && uvx pip-audit -r requirements.txt --strict
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Audit npm dependencies
        run: npm audit --omit=dev --audit-level=high
